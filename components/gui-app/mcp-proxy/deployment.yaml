apiVersion: v1
kind: ServiceAccount
metadata:
  name: mcp-proxy
  namespace: openwebui
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-proxy
  namespace: openwebui
  labels:
    app: mcp-proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mcp-proxy
  template:
    metadata:
      labels:
        app: mcp-proxy
    spec:
      serviceAccountName: mcp-proxy
      containers:
        - name: mcp-proxy
          image: python:3.12-slim
          command:
            - /bin/sh
            - -c
            - |
              pip install mcp-proxy mcp-proxy-for-aws --quiet

              # URL-encode the ARN for the endpoint
              ENCODED_ARN=$(echo "$AGENTCORE_RUNTIME_ARN" | python3 -c "import sys,urllib.parse; print(urllib.parse.quote(sys.stdin.read().strip(), safe=''))")
              ENDPOINT_URL="https://bedrock-agentcore.${AWS_REGION}.amazonaws.com/runtimes/${ENCODED_ARN}/invocations?qualifier=DEFAULT"
              echo "Starting MCP Proxy for: $ENDPOINT_URL"

              # Let mcp-proxy-for-aws use Pod Identity credentials directly (auto-refresh)
              # Do NOT export AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY - they override Pod Identity
              mcp-proxy --host 0.0.0.0 --port 8080 --allow-origin "*" \
                --pass-environment \
                -- mcp-proxy-for-aws "$ENDPOINT_URL" --service bedrock-agentcore --region "$AWS_REGION" --timeout 300
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: AWS_REGION
              value: "us-east-1"
            - name: AGENTCORE_RUNTIME_ARN
              value: "arn:aws:bedrock-agentcore:us-east-1:739907928487:runtime/hosted_agent_eq97r-L7DvQ9Ffu0"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-proxy
  namespace: openwebui
spec:
  selector:
    app: mcp-proxy
  ports:
    - port: 8080
      targetPort: 8080
      name: http
  type: ClusterIP
