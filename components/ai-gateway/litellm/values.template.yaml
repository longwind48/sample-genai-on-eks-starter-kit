replicaCount: 2

image:
  # Stable release with Codex custom-tool round trips (v1.93) and namespace
  # tool preservation (v1.98) in the Responses API bridge.
  tag: v1.100.1

podAnnotations:
  checksum/codex-compat: "{{{CODEX_COMPAT_SHA256}}}"

volumes:
  - name: codex-compat
    configMap:
      name: litellm-codex-compat

volumeMounts:
  - name: codex-compat
    mountPath: /etc/litellm/codex_compat.py
    subPath: codex_compat.py
    readOnly: true

extraResources:
  - apiVersion: v1
    kind: ConfigMap
    metadata:
      name: litellm-codex-compat
    data:
      codex_compat.py: {{{CODEX_COMPAT_SOURCE}}}

global:
  security:
    # -- Allow insecure images to use our ECR images.
    allowInsecureImages: true

strategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 0
    maxSurge: 1

pdb:
  enabled: true
  maxUnavailable: 1

topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: DoNotSchedule
    labelSelector:
      matchLabels:
        app: litellm

{{#if @root.integration.o11y.mlflow}}
image:
  repository: public.ecr.aws/agentic-ai-platforms-on-k8s/litellm
  tag: v1.79.1-mlflow
{{/if}}

resources:
  requests:
    cpu: 1 
    memory: 3Gi
  limits:
    # Raised 2Gi -> 3Gi. 2Gi was not "a bit tight": a freshly started pod already sits
    # at ~1.25Gi (63% of the old cap) before serving traffic, leaving ~750Mi of head-
    # room, and working set climbs ~500Mi over ~17h until PodMemoryNearLimit fires at
    # 85%. At 3Gi the same peak (~1.8Gi) is 60%, so the warning has somewhere to go.
    # requests moved with limits to keep the pod Guaranteed QoS, as the chart intends.
    # If the climb turns out to be unbounded rather than cache warm-up, this only buys
    # time - the fix would then be a memory profile, not a bigger number.
    memory: 3Gi

redis:
  enabled: true
  image:
    registry: public.ecr.aws
    repository: agentic-ai-platforms-on-k8s/redis
    tag: 8.2.1-debian-12-r0
    pullPolicy: IfNotPresent
  master:
    # Prevent Karpenter from evicting this pod during consolidation
    podAnnotations:
      karpenter.sh/do-not-disrupt: "true"
    # Schedule on on-demand nodes for stability
    tolerations:
      - key: workload-type
        operator: Equal
        value: stateful
        effect: NoSchedule
    nodeSelector:
      karpenter.sh/capacity-type: on-demand
    resources:
      requests:
        cpu: 125m
        memory: 256Mi
      limits:
        memory: 256Mi

postgresql:
  image:
    registry: public.ecr.aws
    repository: agentic-ai-platforms-on-k8s/postgresql
    tag: 17.5.0-debian-12-r8
    pullPolicy: IfNotPresent
  primary:
    # Prevent Karpenter from evicting this pod during consolidation
    podAnnotations:
      karpenter.sh/do-not-disrupt: "true"
    # Schedule on on-demand nodes for stability
    tolerations:
      - key: workload-type
        operator: Equal
        value: stateful
        effect: NoSchedule
    nodeSelector:
      karpenter.sh/capacity-type: on-demand
    resources:
      requests:
        cpu: 125m
        memory: 512Mi
      limits:
        # Raised from 256Mi, which OOMKilled this pod (exit 137, 2026-08-29 08:51).
        # 256Mi was ~94% consumed at idle: two litellm replicas hold connection pools
        # and store_prompts_in_spend_logs writes full prompts, so the row volume and
        # WAL churn outgrew the cap. Requests raised too, so the scheduler reserves
        # what postgres actually holds instead of overcommitting the stateful node.
        memory: 1Gi

serviceAccount:
  create: true

masterkey: {{{LITELLM_API_KEY}}}
envVars:
  # SERVER_ROOT_PATH: /litellm # Same as Ingress path
  # UI_BASE_PATH: /litellm/ui # Move UI path but still need to build Docker image https://docs.litellm.ai/docs/proxy/deploy#1-custom-server-root-path-proxy-base-url
  # DOCS_URL: /docs/ # Move docs path but not working yet since LiteLLM hardcodes Swagger resource paths https://github.com/BerriAI/litellm/blob/main/litellm/proxy/proxy_server.py#L794-L796
  # LITELLM_LOG: DEBUG
  UI_USERNAME: {{{LITELLM_UI_USERNAME}}}
  UI_PASSWORD: {{{LITELLM_UI_PASSWORD}}}
  {{#if @root.integration.o11y.langfuse}}
  LANGFUSE_HOST: http://langfuse-web.langfuse:3000
  LANGFUSE_PUBLIC_KEY: {{{LANGFUSE_PUBLIC_KEY}}}
  LANGFUSE_SECRET_KEY: {{{LANGFUSE_SECRET_KEY}}}
  {{/if}}
  {{#if @root.integration.o11y.mlflow}}
  MLFLOW_TRACKING_URI: http://mlflow.mlflow
  MLFLOW_TRACKING_USERNAME: {{{MLFLOW_USERNAME}}}
  MLFLOW_TRACKING_PASSWORD: {{{MLFLOW_PASSWORD}}}
  MLFLOW_EXPERIMENT_NAME: Default
  MLFLOW_EXPERIMENT_ID: 0
  {{/if}}
  {{#if @root.integration.o11y.phoenix}}
  PHOENIX_API_KEY: {{{PHOENIX_API_KEY}}}
  PHOENIX_COLLECTOR_ENDPOINT: http://phoenix-svc.phoenix:4317/v1/traces
  PHOENIX_COLLECTOR_HTTP_ENDPOINT: http://phoenix-svc.phoenix:6006/v1/traces
  {{/if}}

ingress:
  # Internal ALB only. Public access is via the CloudFront + WAF edge (VPC origin),
  # never by exposing the ALB directly. See docs/specs/litellm-public-exposure.md.
  enabled: true
  className: internal-alb
  annotations:
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80}]'
    {{#if CLOUDFRONT_PREFIX_LIST_ID}}
    # Primary lock: only CloudFront edge IPs can reach the ALB at L3/L4. This is
    # the load-bearing control — direct access from anywhere else is dropped at
    # the network layer. Confirmed supported on EKS Auto Mode (containers-roadmap #2556).
    alb.ingress.kubernetes.io/security-group-prefix-lists: {{{CLOUDFRONT_PREFIX_LIST_ID}}}
    {{/if}}
  hosts:
    - paths:
        - path: /
          pathType: Prefix
      {{#if DOMAIN}}
      host: litellm.{{{DOMAIN}}}
      {{/if}}
# ponytail: the X-Origin-Verify shared-secret header (belt-and-suspenders on top
# of the prefix-list lock) is injected by CloudFront and can be enforced later via
# an ALB conditions/actions rule. Skipped here because the use-annotation
# forward+fixed-response dance is fragile to hand-roll in a Helm values template;
# the prefix-list already makes the ALB unreachable except from CloudFront.
# Add when: threat model requires guarding against a compromised in-VPC host.

proxy_config:
  general_settings:
    master_key: os.environ/PROXY_MASTER_KEY
    store_model_in_db: true
    store_prompts_in_spend_logs: true
    max_budget: 10000
    budget_duration: 30d
    # VPC deployment: keep serving if the spend DB blips (per LiteLLM prod guide).
    # Only safe because the proxy isn't directly internet-reachable (CloudFront-only).
    allow_requests_on_db_unavailable: true
  litellm_settings:
    drop_params: true
    # Reliability: long Bedrock turns must not surface as client errors. Without
    # this, a slow generation or a Bedrock throttle bubbles up as a 5xx that
    # Claude Code reports as "Server is busy, retrying". 600s matches the LiteLLM
    # prod reference; retries absorb transient Bedrock ThrottlingException / 5xx.
    request_timeout: 600
    num_retries: 3
    retry_policy:
      TimeoutErrorRetries: 3
      RateLimitErrorRetries: 3
      InternalServerErrorRetries: 3
    # Cost governance defaults
    max_internal_user_budget: 300
    internal_user_budget_duration: 30d
    upperbound_key_generate_params:
      # Raised 300 -> 1000 so a per-key budget can exceed the old ceiling: /key/update
      # enforces this bound too, not just /key/generate, and rejected a $1000 key with
      # "max_budget is over max limit set in config". Note the check only compares
      # numbers, so max_budget: null (unlimited) slips past it entirely - this bound
      # shapes deliberate budgets, it does not stop anyone removing one.
      max_budget: 2000
      budget_duration: "30d"
      duration: "90d"
    {{#with integration.o11y.config}}
    {{#if callbacks}}
    callbacks: {{{callbacks}}}
    {{/if}}
    {{#if success_callback}}
    success_callback: {{{success_callback}}}
    {{/if}}
    {{#if failure_callback}}
    failure_callback: {{{failure_callback}}}
    {{/if}}
    {{/with}}
    # The AMP managed scraper has no way to present a bearer token, and /metrics
    # is authenticated by default (401 unauthenticated, and 404 when the callback
    # is absent, which reads like a missing route rather than a missing callback).
    # The endpoint exposes counters only, never prompts, and the pod is not
    # reachable from outside the cluster.
    require_auth_for_metrics_endpoint: false
    # Label allowlist, and it is load-bearing rather than tidiness. The default
    # label set for these metrics is 11-14 wide and includes api_key_hash,
    # client_ip, user_agent, end_user and user_email. AMP bills per sample
    # ingested, so leaving those on multiplies series by every key x IP x
    # user-agent seen. team + model is what the cost dashboard joins on.
    #
    # `user` is deliberately NOT here. Per-user series would be
    # teams x models x users, which is where this stops being cheap. Per-user
    # spend stays in LiteLLM's own DailyUserSpend table and its UI.
    prometheus_metrics_config:
      - group: cost
        metrics:
          - litellm_spend_metric
          - litellm_input_tokens_metric
          - litellm_output_tokens_metric
          - litellm_input_cached_tokens_metric
          - litellm_input_cache_creation_tokens_metric
        include_labels:
          - team
          - team_alias
          - model
    redact_user_api_key_info: true
    turn_off_message_logging: false
  model_list:
    # Bedrock LLM Models
    {{#each integration.bedrock.llm}}
    - model_name: bedrock/{{{name}}}
      litellm_params:
        model: bedrock/{{{model}}}
        {{#if @root.integration.bedrock.region}}
        aws_region_name: {{{@root.integration.bedrock.region}}}
        {{/if}}
        {{!-- Reasoning on OpenAI models reached through bedrock-runtime.

        litellm <= v1.91.3 has no branch for them, so it maps reasoning_effort to
        Anthropic's `thinking` and Bedrock 400s ("Unknown parameter: 'thinking'").
        The gateway-wide drop_params does not catch it, hence additional_drop_params:
        a client that sends a thinking level gets a normal answer at the model's
        default effort instead of an error.

        To actually pick an effort, send `reasoning: {"effort": low|medium|high|xhigh}`
        in the request body - Bedrock's only accepted shape, forwarded verbatim as
        additionalModelRequestFields. allowed_openai_params is what stops drop_params
        from swallowing it (verified: 467 -> 1178 output tokens across low -> xhigh;
        "minimal" is rejected by Bedrock).

        Drop both lines once the image is on a litellm release that carries
        BerriAI/litellm#38279 (openai.gpt-5* -> reasoning.effort, merged to main
        2026-08-26, unreleased as of v1.99.0-rc.1) - reasoning_effort then works
        natively and needs no client-side special-casing. --}}
        {{#if dropReasoning}}
        additional_drop_params: ["reasoning_effort"]  # see values.template.yaml
        allowed_openai_params: ["reasoning"]
        {{/if}}
    {{/each}}
    # Bedrock Mantle Models (GPT-5.x via OpenAI-compatible Responses API).
    # Different endpoint (/openai/v1) than bedrock/ above. No api_key: with no
    # bearer token, LiteLLM (>=v1.87.2) SigV4-signs via the pod's IAM credentials
    # (EKS Pod Identity) — same role the bedrock/ models use, no static/short-term
    # key to manage. Requires the litellm image >= v1.87.2.
    {{#each integration.bedrock-mantle.llm}}
    - model_name: bedrock-mantle/{{{name}}}
      litellm_params:
        model: bedrock_mantle/{{{model}}}
        aws_region_name: {{{@root.integration.bedrock-mantle.region}}}
        api_base: https://bedrock-mantle.{{{@root.integration.bedrock-mantle.region}}}.api.aws/openai/v1
    {{/each}}
    # Codex aliases (same mantle endpoint/auth; distinct model_name so Codex
    # traffic is identifiable in LiteLLM spend logs).
    {{#each integration.bedrock-mantle.codex}}
    - model_name: codex/{{{name}}}
      litellm_params:
        model: bedrock_mantle/{{{model}}}
        aws_region_name: {{{@root.integration.bedrock-mantle.region}}}
        api_base: https://bedrock-mantle.{{{@root.integration.bedrock-mantle.region}}}.api.aws/openai/v1
    {{/each}}
    # Bedrock Embedding Models
    {{#each integration.bedrock.embedding}}
    - model_name: bedrock/{{{name}}}
      litellm_params:
        model: bedrock/{{{model}}}
        {{#if @root.integration.bedrock.region}}
        aws_region_name: {{{@root.integration.bedrock.region}}}
        {{/if}}
    {{/each}}
    {{#each integration.llm-model.vllm}}
    - model_name: vllm/{{@key}}
      litellm_params:
        model: openai/{{@key}}
        api_key: fake-key
        api_base: http://{{@key}}.vllm:8000/v1
    {{/each}}
    # SGlang Models
    {{#each integration.llm-model.sglang}}
    - model_name: sglang/{{@key}}
      litellm_params:
        model: openai/{{@key}}
        api_key: fake-key
        api_base: http://{{@key}}.sglang:30000/v1
    {{/each}}
    # TGI Models
    {{#each integration.llm-model.tgi}}
    - model_name: tgi/{{@key}}
      litellm_params:
        model: openai/{{@key}}
        api_key: fake-key
        api_base: http://{{@key}}.tgi:80/v1
    {{/each}}
    # Ollama Models
    {{#each integration.llm-model.ollama}}
    - model_name: ollama/{{@key}}
      litellm_params:
        model: ollama/{{@key}}
        api_key: fake-key
        api_base: http://ollama.ollama:11434
        drop_params: true
    {{/each}}
    # TEI Models
    {{#each integration.embedding-model.tei}}
    - model_name: tei/{{@key}}
      litellm_params:
        model: openai/{{@key}}
        api_key: fake-key
        api_base: http://{{@key}}.tei:80/v1
    {{/each}}
  # MCP Servers
  {{#if integration.mcp-servers.length}}
  mcp_servers:
    {{#each integration.mcp-servers}}
    {{this}}:
      url: "http://{{this}}.mcp-server:8000/mcp"
      transport: "http"
      auth_type: "api_key"
      spec_version: "2025-03-26"
    {{/each}}
  {{/if}}
  # Guardrails
  guardrails:
    {{#with integration.guardrail}}
    {{#if bedrock}}
    - guardrail_name: "bedrock-guardrail"
      litellm_params:
        guardrail: bedrock
        # pre_call only, and that is deliberate:
        #   during_call fires concurrently with the LLM call, so the masked messages
        #     and the block it writes back land after the request is already in
        #     flight - it evaluates every prompt and intervenes on none of them.
        #   post_call scans the response, but on the Anthropic /v1/messages route it
        #     500s every streaming request: bedrock_guardrails.py
        #     async_post_call_streaming_iterator_hook feeds Anthropic SSE chunks into
        #     stream_chunk_builder(), which only understands OpenAI chunks ->
        #     "byte indices must be integers". Claude Desktop/Cowork and Claude Code
        #     always stream, so post_call takes the whole gateway down for them.
        #     Re-test on a litellm bump; until then input-side scanning only.
        mode: ["pre_call"]
        default_on: true
        guardrailIdentifier: "{{{bedrock.id}}}"
        guardrailVersion: "{{{bedrock.version}}}"
        {{#if @root.integration.bedrock.region}}
        aws_region_name: {{{@root.integration.bedrock.region}}}
        {{/if}}
        mask_request_content: true
        # No effect while mode is pre_call only - the response is never scanned.
        # Kept false so it does not read as working response masking.
        mask_response_content: false
        experimental_use_latest_role_message_only: true
        skip_system_message_in_guardrail: true
        # Left off deliberately. With it on, a blocked prompt comes back as HTTP 500
        # carrying the block message, which reads as a server fault - clients and
        # litellm_settings.num_retries both retry it, so one blocked prompt costs
        # several ApplyGuardrail calls. Off, a block is a clean HTTP 400 with the
        # triggered assessments in the body.
        disable_exception_on_block: false
    {{/if}}
    {{#if bedrockStrict}}
    # Adds prompt-attack defense on top of the default. default_on is false because
    # PROMPT_ATTACK blocks agentic clients: they inject persona/behaviour-override
    # text into the user turn, Bedrock scores it as injection at HIGH confidence, and
    # a BLOCK pre-empts ANONYMIZE so the request is refused before PII is masked.
    # Opt in per key for chat-app surfaces:
    #   POST /key/generate {"metadata": {"guardrails": ["bedrock-guardrail-strict"]}}
    - guardrail_name: "bedrock-guardrail-strict"
      litellm_params:
        guardrail: bedrock
        mode: ["pre_call"]
        default_on: false
        guardrailIdentifier: "{{{bedrockStrict.id}}}"
        guardrailVersion: "{{{bedrockStrict.version}}}"
        {{#if @root.integration.bedrock.region}}
        aws_region_name: {{{@root.integration.bedrock.region}}}
        {{/if}}
        mask_request_content: true
        mask_response_content: false
        experimental_use_latest_role_message_only: true
        skip_system_message_in_guardrail: true
        disable_exception_on_block: false
    {{/if}}
    {{#if guardrailsAI}}
    - guardrail_name: "guardrails-ai"
      litellm_params:
        guardrail: guardrails_ai
        mode: "pre_call"
        default_on: true
        guard_name: "detect-pii"
        guardrails_ai_api_input_format: "llmOutput"
        api_base: http://guard.guardrails-ai:8000
    {{/if}}
    {{/with}}
