replicaCount: 2

image:
  # Bumped from v1.81.3 to get the bedrock_mantle provider (added 2026-03-05),
  # required for GPT-5.4/5.5 via the Bedrock Mantle Responses API.
  tag: main-v1.91.3-stable

global:
  security:
    # -- Allow insecure images to use our ECR images.
    allowInsecureImages: true

strategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 0
    maxSurge: 1

pdb:
  enabled: true
  maxUnavailable: 1

topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: DoNotSchedule
    labelSelector:
      matchLabels:
        app: litellm

{{#if @root.integration.o11y.mlflow}}
image:
  repository: public.ecr.aws/agentic-ai-platforms-on-k8s/litellm
  tag: v1.79.1-mlflow
{{/if}}

resources:
  requests:
    cpu: 1 
    memory: 2Gi
  limits:
    memory: 2Gi

redis:
  enabled: true
  image:
    registry: public.ecr.aws
    repository: agentic-ai-platforms-on-k8s/redis
    tag: 8.2.1-debian-12-r0
    pullPolicy: IfNotPresent
  master:
    # Prevent Karpenter from evicting this pod during consolidation
    podAnnotations:
      karpenter.sh/do-not-disrupt: "true"
    # Schedule on on-demand nodes for stability
    tolerations:
      - key: workload-type
        operator: Equal
        value: stateful
        effect: NoSchedule
    nodeSelector:
      karpenter.sh/capacity-type: on-demand
    resources:
      requests:
        cpu: 125m
        memory: 256Mi
      limits:
        memory: 256Mi

postgresql:
  image:
    registry: public.ecr.aws
    repository: agentic-ai-platforms-on-k8s/postgresql
    tag: 17.5.0-debian-12-r8
    pullPolicy: IfNotPresent
  primary:
    # Prevent Karpenter from evicting this pod during consolidation
    podAnnotations:
      karpenter.sh/do-not-disrupt: "true"
    # Schedule on on-demand nodes for stability
    tolerations:
      - key: workload-type
        operator: Equal
        value: stateful
        effect: NoSchedule
    nodeSelector:
      karpenter.sh/capacity-type: on-demand
    resources:
      requests:
        cpu: 125m
        memory: 256Mi
      limits:
        memory: 256Mi

serviceAccount:
  create: true

masterkey: {{{LITELLM_API_KEY}}}
envVars:
  # SERVER_ROOT_PATH: /litellm # Same as Ingress path
  # UI_BASE_PATH: /litellm/ui # Move UI path but still need to build Docker image https://docs.litellm.ai/docs/proxy/deploy#1-custom-server-root-path-proxy-base-url
  # DOCS_URL: /docs/ # Move docs path but not working yet since LiteLLM hardcodes Swagger resource paths https://github.com/BerriAI/litellm/blob/main/litellm/proxy/proxy_server.py#L794-L796
  # LITELLM_LOG: DEBUG
  UI_USERNAME: {{{LITELLM_UI_USERNAME}}}
  UI_PASSWORD: {{{LITELLM_UI_PASSWORD}}}
  {{#if @root.integration.o11y.langfuse}}
  LANGFUSE_HOST: http://langfuse-web.langfuse:3000
  LANGFUSE_PUBLIC_KEY: {{{LANGFUSE_PUBLIC_KEY}}}
  LANGFUSE_SECRET_KEY: {{{LANGFUSE_SECRET_KEY}}}
  {{/if}}
  {{#if @root.integration.o11y.mlflow}}
  MLFLOW_TRACKING_URI: http://mlflow.mlflow
  MLFLOW_TRACKING_USERNAME: {{{MLFLOW_USERNAME}}}
  MLFLOW_TRACKING_PASSWORD: {{{MLFLOW_PASSWORD}}}
  MLFLOW_EXPERIMENT_NAME: Default
  MLFLOW_EXPERIMENT_ID: 0
  {{/if}}
  {{#if @root.integration.o11y.phoenix}}
  PHOENIX_API_KEY: {{{PHOENIX_API_KEY}}}
  PHOENIX_COLLECTOR_ENDPOINT: http://phoenix-svc.phoenix:4317/v1/traces
  PHOENIX_COLLECTOR_HTTP_ENDPOINT: http://phoenix-svc.phoenix:6006/v1/traces
  {{/if}}

ingress:
  # Internal ALB only. Public access is via the CloudFront + WAF edge (VPC origin),
  # never by exposing the ALB directly. See docs/specs/litellm-public-exposure.md.
  enabled: true
  className: internal-alb
  annotations:
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80}]'
    {{#if CLOUDFRONT_PREFIX_LIST_ID}}
    # Primary lock: only CloudFront edge IPs can reach the ALB at L3/L4. This is
    # the load-bearing control — direct access from anywhere else is dropped at
    # the network layer. Confirmed supported on EKS Auto Mode (containers-roadmap #2556).
    alb.ingress.kubernetes.io/security-group-prefix-lists: {{{CLOUDFRONT_PREFIX_LIST_ID}}}
    {{/if}}
  hosts:
    - paths:
        - path: /
          pathType: Prefix
      {{#if DOMAIN}}
      host: litellm.{{{DOMAIN}}}
      {{/if}}
# ponytail: the X-Origin-Verify shared-secret header (belt-and-suspenders on top
# of the prefix-list lock) is injected by CloudFront and can be enforced later via
# an ALB conditions/actions rule. Skipped here because the use-annotation
# forward+fixed-response dance is fragile to hand-roll in a Helm values template;
# the prefix-list already makes the ALB unreachable except from CloudFront.
# Add when: threat model requires guarding against a compromised in-VPC host.

proxy_config:
  general_settings:
    master_key: os.environ/PROXY_MASTER_KEY
    store_model_in_db: true
    store_prompts_in_spend_logs: true
    max_budget: 10000
    budget_duration: 30d
  litellm_settings:
    drop_params: true
    # Cost governance defaults
    max_internal_user_budget: 300
    internal_user_budget_duration: 30d
    upperbound_key_generate_params:
      max_budget: 300
      budget_duration: "30d"
      duration: "90d"
    {{#with integration.o11y.config}}
    {{#if callbacks}}
    callbacks: {{{callbacks}}}
    {{/if}}
    {{#if success_callback}}
    success_callback: {{{success_callback}}}
    {{/if}}
    {{#if failure_callback}}
    failure_callback: {{{failure_callback}}}
    {{/if}}
    {{/with}}
    redact_user_api_key_info: true
    turn_off_message_logging: false
  model_list:
    # Bedrock LLM Models
    {{#each integration.bedrock.llm}}
    - model_name: bedrock/{{{name}}}
      litellm_params:
        model: bedrock/{{{model}}}
        {{#if @root.integration.bedrock.region}}
        aws_region_name: {{{@root.integration.bedrock.region}}}
        {{/if}}
    {{/each}}
    # Bedrock Mantle Models (GPT-5.x via OpenAI-compatible Responses API).
    # Different endpoint (/openai/v1) than bedrock/ above. No api_key: with no
    # bearer token, LiteLLM (>=v1.87.2) SigV4-signs via the pod's IAM credentials
    # (EKS Pod Identity) — same role the bedrock/ models use, no static/short-term
    # key to manage. Requires the litellm image >= v1.87.2 (we pin v1.91.3).
    {{#each integration.bedrock-mantle.llm}}
    - model_name: bedrock-mantle/{{{name}}}
      litellm_params:
        model: bedrock_mantle/{{{model}}}
        aws_region_name: {{{@root.integration.bedrock-mantle.region}}}
        api_base: https://bedrock-mantle.{{{@root.integration.bedrock-mantle.region}}}.api.aws/openai/v1
    {{/each}}
    # Bedrock Embedding Models
    {{#each integration.bedrock.embedding}}
    - model_name: bedrock/{{{name}}}
      litellm_params:
        model: bedrock/{{{model}}}
        {{#if @root.integration.bedrock.region}}
        aws_region_name: {{{@root.integration.bedrock.region}}}
        {{/if}}
    {{/each}}
    {{#each integration.llm-model.vllm}}
    - model_name: vllm/{{@key}}
      litellm_params:
        model: openai/{{@key}}
        api_key: fake-key
        api_base: http://{{@key}}.vllm:8000/v1
    {{/each}}
    # SGlang Models
    {{#each integration.llm-model.sglang}}
    - model_name: sglang/{{@key}}
      litellm_params:
        model: openai/{{@key}}
        api_key: fake-key
        api_base: http://{{@key}}.sglang:30000/v1
    {{/each}}
    # TGI Models
    {{#each integration.llm-model.tgi}}
    - model_name: tgi/{{@key}}
      litellm_params:
        model: openai/{{@key}}
        api_key: fake-key
        api_base: http://{{@key}}.tgi:80/v1
    {{/each}}
    # Ollama Models
    {{#each integration.llm-model.ollama}}
    - model_name: ollama/{{@key}}
      litellm_params:
        model: ollama/{{@key}}
        api_key: fake-key
        api_base: http://ollama.ollama:11434
        drop_params: true
    {{/each}}
    # TEI Models
    {{#each integration.embedding-model.tei}}
    - model_name: tei/{{@key}}
      litellm_params:
        model: openai/{{@key}}
        api_key: fake-key
        api_base: http://{{@key}}.tei:80/v1
    {{/each}}
  # MCP Servers
  {{#if integration.mcp-servers.length}}
  mcp_servers:
    {{#each integration.mcp-servers}}
    {{this}}:
      url: "http://{{this}}.mcp-server:8000/mcp"
      transport: "http"
      auth_type: "api_key"
      spec_version: "2025-03-26"
    {{/each}}
  {{/if}}
  # Guardrails
  guardrails:
    {{#with integration.guardrail}}
    {{#if bedrock}}
    - guardrail_name: "bedrock-guardrail"
      litellm_params:
        guardrail: bedrock
        mode: "during_call"
        default_on: true
        guardrailIdentifier: "{{{bedrock.id}}}"
        guardrailVersion: "{{{bedrock.version}}}"
        {{#if @root.integration.bedrock.region}}
        aws_region_name: {{{@root.integration.bedrock.region}}}
        {{/if}}
        mask_request_content: true
        mask_response_content: true
        experimental_use_latest_role_message_only: true
        skip_system_message_in_guardrail: true
        disable_exception_on_block: true
    {{/if}}    
    {{#if guardrailsAI}}
    - guardrail_name: "guardrails-ai"
      litellm_params:
        guardrail: guardrails_ai
        mode: "pre_call"
        default_on: true
        guard_name: "detect-pii"
        guardrails_ai_api_input_format: "llmOutput"
        api_base: http://guard.guardrails-ai:8000
    {{/if}}
    {{/with}}
