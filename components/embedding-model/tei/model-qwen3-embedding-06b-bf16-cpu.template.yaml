apiVersion: apps/v1
kind: Deployment
metadata:
  name: qwen3-embedding-06b-bf16-cpu
  namespace: tei
spec:
  replicas: 1
  selector:
    matchLabels:
      app: qwen3-embedding-06b-bf16-cpu
  template:
    metadata:
      labels:
        app: qwen3-embedding-06b-bf16-cpu
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/arch: amd64
        # Removed r7i constraint - allows scheduling on smaller instances
      containers:
        - name: tei
          image: {{GHCR_IMAGE_PREFIX}}huggingface/text-embeddings-inference:cpu-1.8.2
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - NET_RAW
            seccompProfile:
              type: RuntimeDefault
          args:
            - --model-id=Qwen/Qwen3-Embedding-0.6B
            - --huggingface-hub-cache=/root/.cache/huggingface/hub
            # Lowered from 8192, which OOMKilled this pod in a loop (41 restarts in
            # 5.5h, 2026-08-29). It died in "Warming up model", never under user load:
            # warmup runs one forward pass sized to this flag, and attention on a
            # single 8192-token sequence is 8192^2 x 16 heads x 4B ~ 4.3GB of buffer
            # per layer on the CPU/candle backend, so it blew the 10Gi limit. Raising
            # the limit would only move the wall; 2048 keeps warmup ~16x cheaper and
            # is still far above the RAG chunk sizes this serves.
            - --max-batch-tokens=2048
            # Pairs with the line above: without it, any single input longer than
            # max-batch-tokens is rejected outright, so shrinking the batch would
            # trade a crash loop for hard request failures on long documents.
            - --auto-truncate
          env:
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-token
                  key: token
          ports:
            - name: http
              containerPort: 80
          resources:
            requests:
              cpu: 500m
              memory: 6Gi
            limits:
              cpu: 2000m
              memory: 10Gi
          volumeMounts:
            - name: huggingface-cache
              mountPath: /root/.cache/huggingface
            - name: shm
              mountPath: /dev/shm
      volumes:
        - name: huggingface-cache
          persistentVolumeClaim:
            claimName: huggingface-cache
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: qwen3-embedding-06b-bf16-cpu
  namespace: tei
spec:
  selector:
    app: qwen3-embedding-06b-bf16-cpu
  ports:
    - name: http
      port: 80
